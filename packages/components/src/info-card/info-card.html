<template shadowrootmode="open">
  <style>
    .card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      margin: 8px 0;
      font-family: var(--fontFamilyBase, 'Segoe UI', sans-serif);
    }
    .card-title {
      font-size: 1.1em;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .card-body {
      color: #555;
    }
  </style>
  <div class="card">
    <div class="card-title">{{title}}</div>
    <div class="card-body">{{body}}</div>
  </div>
</template>
